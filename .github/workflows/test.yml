name: Tests und Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/
      - run: ./build.sh
      - name: index.html muss aktuell sein
        run: git diff --exit-code -- index.html || (echo "index.html ist nicht aus src/ gebaut – ./build.sh ausführen und committen" && exit 1)
